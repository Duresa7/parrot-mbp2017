# Installed by parrot-mbp2017 (desktop).
# t1-touchbar.service stops with the graphical session but only starts with
# the user's systemd manager. Logging back in while that manager is still
# running, within 10 seconds or while SSH or lingering keeps it alive, left
# the Touch Bar frozen. Start the Touch Bar with every graphical session.
[Unit]
Wants=t1-touchbar.service
